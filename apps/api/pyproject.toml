[project]
name = "aether-eoc-api"
version = "0.1.0"
description = "Reference EOC API: ICS board, resource requests, HITL agents, append-only audit log."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "pyjwt>=2.9",
    # Used for the OPTIONAL outbound LLM call and by the test client. Deliberately
    # not the vendor SDKs: the no-key path is the default, so a thin HTTP client
    # keeps the dependency surface honest about what this demo actually needs.
    "httpx>=0.27",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pyright>=1.1.386",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "B008",  # FastAPI's Depends()-in-defaults is the framework's idiom.
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../../tests/api"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.pyright]
include = ["app"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
